<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Sandboxed preview: intercept WebSocket connection rejections from Vite dev client
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (event.reason.message?.includes('WebSocket') ||
            event.reason?.stack?.includes('@vite/client') ||
            event.reason?.message?.includes('closed without opened'))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        if (
          event.filename?.includes('@vite/client') ||
          event.message?.includes('WebSocket')
        ) {
          event.preventDefault();
        }
      });
    </script>
    <title>DishSignal - Find Exactly What You're Craving</title>
    <meta name="description" content="Discover nearby restaurants, coffee shops, matcha cafés, and bakeries serving the exact food, drink, or pastry you want with verified menus and interactive maps." />

    <meta property="og:description" content="Discover nearby restaurants, coffee shops, matcha cafés, and bakeries serving the exact food, drink, or pastry you want with verified menus and interactive maps." />
